<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1d4ed8">
    <title>Offline · Tabulation System</title>
    <style>
        :root { color-scheme: light; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            background: #f1f5f9; color: #0f172a;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            max-width: 420px; margin: 16px; padding: 28px 24px; text-align: center;
            background: #fff; border-radius: 12px; box-shadow: 0 6px 24px rgba(15, 23, 42, .08);
        }
        h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
        p { margin: 0 0 1rem; line-height: 1.5; color: #475569; }
        button {
            border: 0; border-radius: 8px; padding: .65rem 1.4rem; font-size: 1rem; font-weight: 600;
            background: #1d4ed8; color: #fff; cursor: pointer;
        }
        button:hover { background: #1e40af; }
        .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #dc3545; margin-right: 6px; }
    </style>
</head>
<body>
    <div class="card">
        <h1><span class="dot" id="dot"></span><span id="state">No connection to the server</span></h1>
        <p>Scores you already typed in are stored on this device and will be sent automatically when the scoring page opens again.</p>
        <p>Check the Wi-Fi, then reload.</p>
        <button type="button" onclick="location.reload()">Reload</button>
    </div>
    <script>
        // Reload by itself as soon as the device is back online
        window.addEventListener('online', function () { location.reload(); });
    </script>
</body>
</html>
